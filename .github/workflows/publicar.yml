name: Promedio diario y publicación

on:
  schedule:
    - cron: "23 4 * * *"    # 06:23 en Madrid (verano)
    - cron: "41 7 * * *"    # respaldo: 09:41 en Madrid (verano)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  promedio:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::rvest, any::xml2, any::httr2, any::jsonlite, any::dplyr, any::stringr
      - name: Calcular promedio.json
        run: Rscript R/promedio.R
      - name: Guardar promedio.json si ha cambiado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promedio.json
          git diff --cached --quiet || git commit -m "Promedio de encuestas $(date +%F)"
          git pull --rebase
          git push

  publicar:
    needs: promedio
    if: always() && (needs.promedio.result == 'success' || needs.promedio.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Preparar la web (solo lo público)
        run: |
          mkdir _site
          cp index.html app.js data.json _site/
          [ -f promedio.json ] && cp promedio.json _site/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
