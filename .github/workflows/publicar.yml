name: Publicar la web

# La web se publica cada vez que cambia algo en este repositorio:
#  - data.json lo envía el robot «Datos nuevos» del repositorio privado agenda-social-datos
#  - promedio.json lo envía cada día el robot «Promedio diario de encuestas» del privado
#  - index.html / app.js cuando cambias el diseño
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar la web (solo lo público)
        run: |
          mkdir _site
          cp index.html app.js data.json _site/
          [ -f promedio.json ] && cp promedio.json _site/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
