name: Publicar la web

# La web (index.html) la envía el robot «Actualizar la web» del repositorio privado agenda-social-datos.
# Aquí solo se publica en GitHub Pages cada vez que cambia algo en este repositorio.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar la web (solo lo público)
        run: |
          mkdir _site
          cp index.html _site/
          for f in app.js data.json promedio.json; do [ -f "$f" ] && cp "$f" _site/ || true; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
